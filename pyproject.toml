[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcontext"
version = "0.1.0"
description = "Local, evidence-first search for small Python codebases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.4"]

[project.optional-dependencies]
dev = ["ruff==0.14.4", "pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
